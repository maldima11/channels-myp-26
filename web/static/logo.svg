<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091421"/>
      <stop offset="60%" stop-color="#0d231a"/>
      <stop offset="100%" stop-color="#081b14"/>
    </linearGradient>

    <!-- Vibrant Maize Gold Gradient -->
    <linearGradient id="maizeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Golden Kernel Highlight Gradient -->
    <linearGradient id="kernelGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Sweeping Leaf Gradient (Primary Emerald) -->
    <linearGradient id="leafPrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Secondary Leaf Accent Gradient -->
    <linearGradient id="leafSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Subtle Radial Glow Behind Maize -->
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#091421" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- MODERN APP CONTAINER SQUIRCLE -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- INNER SUBTLE GLASS RIM BORDER -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- AMBIENT SOLAR/GROWTH GLOW -->
  <circle cx="256" cy="245" r="190" fill="url(#sunGlow)"/>

  <!-- ======================================================== -->
  <!-- CENTRAL EMBLEM: STYLIZED MODERN MAIZE EAR & YIELD SPROUT  -->
  <!-- ======================================================== -->
  <g filter="url(#softShadow)" transform="translate(0, -6)">
    
    <!-- BACK/RIGHT ACCENT LEAF (Secondary Balance) -->
    <path d="M 270,360 
             C 325,355 375,310 380,245 
             C 382,215 372,185 352,165 
             C 358,198 348,235 328,265 
             C 310,292 288,328 270,360 Z" 
          fill="url(#leafSecondary)" 
          opacity="0.95"/>

    <!-- MAIZE EAR BASE SILHOUETTE (Deep Rich Warm Core) -->
    <path d="M 256,110 
             C 275,110 294,128 300,155 
             C 308,190 308,270 295,315 
             C 285,348 268,365 256,365 
             C 244,365 227,348 217,315 
             C 204,270 204,190 212,155 
             C 218,128 237,110 256,110 Z" 
          fill="url(#maizeGold)"/>

    <!-- CLEAN MODERN GEOMETRIC KERNELS (Pill/Facet Arrangement) -->
    <g fill="url(#kernelGlow)" opacity="0.95">
      <!-- Tip Kernel -->
      <rect x="246" y="122" width="20" height="26" rx="10"/>

      <!-- Row 1 -->
      <rect x="227" y="154" width="18" height="25" rx="9"/>
      <rect x="247" y="152" width="18" height="27" rx="9"/>
      <rect x="267" y="154" width="18" height="25" rx="9"/>

      <!-- Row 2 -->
      <rect x="223" y="184" width="19" height="26" rx="9.5"/>
      <rect x="246" y="183" width="20" height="28" rx="10"/>
      <rect x="270" y="184" width="19" height="26" rx="9.5"/>

      <!-- Row 3 -->
      <rect x="222" y="215" width="20" height="27" rx="10"/>
      <rect x="245" y="214" width="22" height="29" rx="10"/>
      <rect x="270" y="215" width="20" height="27" rx="10"/>

      <!-- Row 4 -->
      <rect x="223" y="246" width="20" height="27" rx="10"/>
      <rect x="246" y="246" width="20" height="28" rx="10"/>
      <rect x="269" y="246" width="20" height="27" rx="10"/>

      <!-- Row 5 -->
      <rect x="228" y="277" width="19" height="26" rx="9.5"/>
      <rect x="247" y="277" width="18" height="27" rx="9"/>
      <rect x="265" y="277" width="19" height="26" rx="9.5"/>

      <!-- Row 6 (Bottom taper) -->
      <rect x="236" y="307" width="18" height="24" rx="9"/>
      <rect x="258" y="307" width="18" height="24" rx="9"/>
    </g>

    <!-- MAIN SWEEPING LEAF (Iconic Modern Emerald Arc - Yield & Growth) -->
    <path d="M 252,382 
             C 215,380 160,345 142,282 
             C 128,232 138,172 172,118 
             C 174,115 178,118 177,122 
             C 162,170 166,224 194,266 
             C 214,296 238,328 258,352 
             C 264,359 260,378 252,382 Z" 
          fill="url(#leafPrimary)" 
          filter="url(#leafShadow)"/>

    <!-- ELEGANT LEAF VEIN (Modern Subtle Accent Line) -->
    <path d="M 172,120 
             C 166,180 184,242 228,298 
             C 244,318 255,346 256,368" 
          fill="none" 
          stroke="rgba(255, 255, 255, 0.45)" 
          stroke-width="2.5" 
          stroke-linecap="round"/>

    <!-- STALK BASE (Grounded Modern Stem) -->
    <path d="M 248,368 
             C 246,392 242,408 238,416 
             C 236,419 240,422 243,421 
             C 255,416 266,396 268,368 Z" 
          fill="#059669"/>
  </g>

</svg>
